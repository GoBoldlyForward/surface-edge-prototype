<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Surface Edge Order Desk</title>
<link rel="stylesheet" href="bootstrap.min.css">
<link rel="stylesheet" href="bootstrap-icons.min.css">
<style>
/* Layout follows the admin templates: fixed dark sidebar, white topbar with breadcrumbs, page-content with page-header, tabs, toolbar, data tables. Colors are tokens so the viewer's dark theme works; the sidebar stays dark in both. */
:root{
  --sidebar-width:240px; --sidebar-bg:#1a1d2e; --sidebar-text:#8b8fa3; --sidebar-hover:#ffffff; --sidebar-active-bg:rgba(99,102,241,.15); --sidebar-active-text:#818cf8; --topbar-height:56px;
  --page-bg:#f5f6fa; --surface:#ffffff; --surface-2:#f9fafb; --surface-3:#f3f4f6; --border:#e5e7eb; --border-soft:#f3f4f6; --border-input:#d1d5db;
  --text:#111827; --text-2:#374151; --text-muted:#6b7280; --text-faint:#9ca3af; --accent:#4f46e5; --accent-2:#6366f1;
  --good-fg:#166534; --good-bg:#dcfce7; --good-dot:#16a34a; --warn-fg:#92400e; --warn-bg:#fef3c7; --warn-dot:#f59e0b; --crit-fg:#991b1b; --crit-bg:#fee2e2; --crit-dot:#ef4444; --info-fg:#3730a3; --info-bg:#e0e7ff; --info-dot:#6366f1; --gray-fg:#6b7280; --gray-bg:#f3f4f6; --gray-dot:#9ca3af;
  --bs-primary:#4f46e5; --bs-primary-rgb:79,70,229; --bs-link-color:#4f46e5; --bs-link-color-rgb:79,70,229; --bs-link-hover-color:#4338ca; --bs-link-hover-color-rgb:67,56,202;
  --bs-body-bg:var(--page-bg); --bs-body-color:var(--text); --bs-border-color:var(--border); --bs-offcanvas-width:var(--sidebar-width);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page-bg:#0f1117; --surface:#161925; --surface-2:#1b1f2d; --surface-3:#222738; --border:#2a2f42; --border-soft:#222738; --border-input:#3a4057;
  --text:#f3f4f6; --text-2:#d1d5db; --text-muted:#9ca3af; --text-faint:#6b7280; --accent:#818cf8; --accent-2:#a5b4fc;
  --good-fg:#86efac; --good-bg:rgba(34,197,94,.15); --warn-fg:#fcd34d; --warn-bg:rgba(245,158,11,.15); --crit-fg:#fca5a5; --crit-bg:rgba(239,68,68,.15); --info-fg:#c7d2fe; --info-bg:rgba(99,102,241,.18); --gray-fg:#9ca3af; --gray-bg:#222738;
  --bs-primary:#6366f1; --bs-primary-rgb:99,102,241; --bs-link-color:#a5b4fc; --bs-link-color-rgb:165,180,252; --bs-link-hover-color:#c7d2fe; --bs-link-hover-color-rgb:199,210,254; color-scheme:dark } }
:root[data-theme="dark"]{
  --page-bg:#0f1117; --surface:#161925; --surface-2:#1b1f2d; --surface-3:#222738; --border:#2a2f42; --border-soft:#222738; --border-input:#3a4057;
  --text:#f3f4f6; --text-2:#d1d5db; --text-muted:#9ca3af; --text-faint:#6b7280; --accent:#818cf8; --accent-2:#a5b4fc;
  --good-fg:#86efac; --good-bg:rgba(34,197,94,.15); --warn-fg:#fcd34d; --warn-bg:rgba(245,158,11,.15); --crit-fg:#fca5a5; --crit-bg:rgba(239,68,68,.15); --info-fg:#c7d2fe; --info-bg:rgba(99,102,241,.18); --gray-fg:#9ca3af; --gray-bg:#222738;
  --bs-primary:#6366f1; --bs-primary-rgb:99,102,241; --bs-link-color:#a5b4fc; --bs-link-color-rgb:165,180,252; --bs-link-hover-color:#c7d2fe; --bs-link-hover-color-rgb:199,210,254; color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--page-bg);color:var(--text);margin:0;min-height:100vh}
.btn-primary{--bs-btn-bg:var(--accent);--bs-btn-border-color:var(--accent);--bs-btn-hover-bg:#4338ca;--bs-btn-hover-border-color:#4338ca;--bs-btn-active-bg:#4338ca;--bs-btn-active-border-color:#4338ca}
.btn-outline-secondary{--bs-btn-color:var(--text-2);--bs-btn-border-color:var(--border-input);--bs-btn-hover-bg:var(--surface-2);--bs-btn-hover-color:var(--text);--bs-btn-hover-border-color:#b0b5c0;--bs-btn-active-bg:var(--surface-3);--bs-btn-active-color:var(--text);--bs-btn-active-border-color:#b0b5c0;background:var(--surface)}
.btn-outline-danger{--bs-btn-hover-bg:var(--crit-bg);--bs-btn-hover-color:var(--crit-fg)}
.form-control,.form-select{background:var(--surface);color:var(--text);border-color:var(--border-input)}
.form-control:focus,.form-select:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.dropdown-menu{--bs-dropdown-bg:var(--surface);--bs-dropdown-color:var(--text);--bs-dropdown-link-color:var(--text-2);--bs-dropdown-border-color:var(--border);--bs-dropdown-link-hover-bg:var(--surface-3)}
.minw0{min-width:0}
.mono{font-family:var(--bs-font-monospace);font-size:.92em;font-variant-numeric:tabular-nums}

/* ── Sidebar ── */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-width);height:100vh;z-index:1040;overflow-y:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sidebar-inner{background:var(--sidebar-bg);display:flex;flex-direction:column;min-height:100%;width:100%}
.sidebar-logo{padding:20px 20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.07)}
.sidebar-logo .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#818cf8,#6366f1);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
.sidebar-logo .logo-text{color:#fff;font-size:17px;font-weight:600;letter-spacing:-.3px;line-height:1.1}
.sidebar-logo .logo-sub{color:var(--sidebar-text);font-size:11px}
.sidebar-nav{flex:1;padding:12px 10px}
.nav-section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:rgba(139,143,163,.5);padding:16px 12px 6px}
.sidebar .nav-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:var(--sidebar-text);font-size:14px;font-weight:450;text-decoration:none;transition:all .15s ease;margin-bottom:2px}
.sidebar .nav-link:hover{background:rgba(255,255,255,.06);color:var(--sidebar-hover)}
.sidebar .nav-link.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text);font-weight:500}
.sidebar .nav-link .bi{font-size:17px;width:20px;text-align:center}
.sidebar .nav-link .badge{margin-left:auto;font-size:11px;font-weight:500;padding:2px 7px;border-radius:10px}
/* Group row is the toggle: section icon when closed, down chevron when open. The sub-item rail runs under the chevron's center (12px padding + half of the 20px icon column). */
button.nav-link{width:100%;border:0;background:transparent;font:inherit;text-align:left;cursor:pointer}
.nav-group .nav-link .bi-chevron-down{font-size:13px}
.nav-sub{display:none;position:relative;margin:0 0 4px 22px;padding-left:12px}
.nav-group.open .nav-sub{display:block}
.nav-sub::before{content:"";position:absolute;left:-0.5px;top:0;bottom:0;width:1px;background:rgba(139,143,163,.3)}
.nav-sub .nav-link{padding:6px 12px 6px 12px;font-size:13px;position:relative}
.nav-sub .nav-link::before{content:"";position:absolute;left:-12px;top:50%;width:8px;height:1px;background:rgba(139,143,163,.3)}
.nav-sub .nav-link.active::before{background:var(--sidebar-active-text)}
/* The extra bottom padding keeps these links clear of the Pinpoint feedback button, which sits 20px from the bottom-left corner. */
.sidebar-bottom{padding:10px 10px 78px;border-top:1px solid rgba(255,255,255,.07)}
.sidebar .btn-close{filter:invert(1) grayscale(100%) brightness(200%)}
/* On phones the sidebar is a Bootstrap offcanvas, so it needs Bootstrap's offcanvas z-index (1045) to sit above the backdrop (1040). The z-index on .sidebar above is for desktop and would leave the open menu under the backdrop. */
@media (max-width:767.98px){.sidebar{padding-top:0;z-index:1045}}

/* ── Main / Topbar ── */
.main-content{margin-left:var(--sidebar-width);min-height:100vh;display:flex;flex-direction:column}
body.portal .sidebar{display:none}
body.portal .main-content{margin-left:0}
@media (max-width:767.98px){.main-content{margin-left:0}}
.topbar{height:var(--topbar-height);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:env(safe-area-inset-top,0px);z-index:1030;gap:12px}
/* The breadcrumb is one line of text that ends in an ellipsis when there isn't room, as on phones. Bootstrap's flex row with floated dividers squeezed the items into each other, and the nav around it did not shrink, so the trail ran under the topbar buttons. */
.topbar nav{min-width:0}
.breadcrumb{display:block;margin:0;background:transparent;padding:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.breadcrumb-item{display:inline}
.breadcrumb-item a{color:var(--text-muted);text-decoration:none}
.breadcrumb-item a:hover{color:var(--accent)}
.breadcrumb-item.active{color:var(--text);font-weight:500}
.breadcrumb-item+.breadcrumb-item::before{float:none;color:var(--text-faint)}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-icon-btn{width:36px;height:36px;border-radius:8px;border:none;background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;position:relative}
.topbar-icon-btn:hover{background:var(--surface-3);color:var(--text)}
.topbar-icon-btn .notification-dot{position:absolute;top:7px;right:7px;width:8px;height:8px;background:#ef4444;border-radius:50%;border:2px solid var(--surface)}
.user-menu-btn{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:8px;border:none;background:transparent;cursor:pointer}
.user-menu-btn:hover{background:var(--surface-3)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#818cf8,#6366f1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600}
.user-menu-btn .user-name{font-size:13px;font-weight:500;color:var(--text-2)}
.proto-tag{font-size:11px;color:var(--text-faint);border:1px dashed var(--border-input);border-radius:6px;padding:2px 8px;white-space:nowrap}

/* ── Page ── */
.page-content{flex:1;padding:24px;display:flex;flex-direction:column;gap:0;min-width:0}
@media (max-width:767.98px){.page-content{padding:16px}}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.page-header-left{display:flex;align-items:flex-start;gap:12px;min-width:0}
.page-header h1{font-size:24px;font-weight:700;color:var(--text);margin:0;letter-spacing:-.3px;line-height:1.2}
.page-header .record-id{font-size:13px;color:var(--text-faint);font-weight:400;margin-left:8px;font-family:var(--bs-font-monospace)}
.page-subtitle{font-size:14px;color:var(--text-muted);margin-top:4px;max-width:70ch}
.page-header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.back-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border-input);background:var(--surface);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;text-decoration:none;margin-top:2px}
.back-btn:hover{background:var(--surface-2);color:var(--text-2)}
.page-tabs{margin-bottom:20px}
.page-tabs .nav-tabs{border-bottom:2px solid var(--border)}
.page-tabs .nav-tabs .nav-link{border:none;border-bottom:2px solid transparent;margin-bottom:-2px;padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-muted)}
.page-tabs .nav-tabs .nav-link:hover{color:var(--text-2);border-color:var(--border-input)}
.page-tabs .nav-tabs .nav-link.active{color:var(--accent);border-color:var(--accent);background:transparent}
.page-tabs .nav-tabs .nav-link .badge{font-size:11px;font-weight:500;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.toolbar-search{position:relative;flex:0 1 360px;min-width:200px}
.toolbar-search .form-control{padding-left:38px;border-radius:8px;height:38px;font-size:14px}
.toolbar-search .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:15px;pointer-events:none}
.toolbar-right{display:flex;align-items:center;gap:8px}
.toolbar-btn{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--border-input);background:var(--surface);color:var(--text-2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.toolbar-btn:hover,.toolbar-btn.show{background:var(--surface-2)}
.toolbar-btn .bi{font-size:16px;color:var(--text-muted)}
.toolbar-btn.has-value{padding-right:12px;border-color:var(--accent-2);color:var(--accent)}
.toolbar-btn.has-value .bi{color:var(--accent)}
.toolbar-btn.dropdown-toggle::after{display:none}
.dropdown-menu{--bs-dropdown-link-active-bg:var(--accent);--bs-dropdown-link-active-color:#fff;--bs-dropdown-header-color:var(--text-faint);font-size:13px;min-width:200px}
.dropdown-header{font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.layout-toggle{display:flex;border:1px solid var(--border-input);border-radius:8px;overflow:hidden;background:var(--surface)}
.layout-toggle .toggle-label{display:flex;align-items:center;padding:0 10px;font-size:12px;color:var(--text-faint);border-right:1px solid var(--border-input);white-space:nowrap}
.layout-toggle .toggle-btn{display:flex;align-items:center;gap:6px;padding:0 12px;height:36px;border:none;background:var(--surface);color:var(--text-faint);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.layout-toggle .toggle-btn:not(:last-child){border-right:1px solid var(--border-input)}
.layout-toggle .toggle-btn:hover{color:var(--text-2);background:var(--surface-2)}
.layout-toggle .toggle-btn.active{background:var(--surface-3);color:var(--text)}
/* Info strip: one fixed-height line under the tab row on every index page; click to read the full note. */
.info-strip{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin:0 0 16px;color:var(--text-muted);font-size:13px;line-height:1.45;cursor:pointer;font-family:inherit}
.info-strip:hover{border-color:var(--border-input);color:var(--text-2)}
.info-strip .bi-info-circle{color:var(--accent-2);font-size:15px;flex-shrink:0;line-height:1.3}
.info-strip .info-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info-strip.open .info-text{white-space:normal}
.info-strip .info-chev{flex-shrink:0;font-size:11px;color:var(--text-faint);transition:transform .15s ease;line-height:1.6}
.info-strip:not(.open):not(.clipped){cursor:default}
.sub-nav{gap:4px;margin:-4px 0 12px;flex-wrap:nowrap;overflow-x:auto}
.sub-nav .nav-link{padding:4px 12px;font-size:13px;font-weight:500;border-radius:999px;color:var(--text-muted);white-space:nowrap}
.sub-nav .nav-link:hover{color:var(--text-2);background:var(--surface-3)}
.sub-nav .nav-link.active{background:var(--info-bg);color:var(--accent)}
.sub-nav .nav-link .badge{font-size:11px;font-weight:500;padding:2px 7px;border-radius:10px;margin-left:4px}
.feed-list{list-style:none;margin:0;padding:0 20px 8px;flex:1}
.feed-day{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);padding:14px 0 6px;border-bottom:1px solid var(--border-soft)}
.feed-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft)}
.feed-line{font-size:13px;color:var(--text-2);line-height:1.5}
.feed-line b{color:var(--text);font-weight:600}
.feed-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text-faint);margin-top:2px}
/* ── Portal chat launcher ── */
.cw-bubble{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#818cf8,#4f46e5);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(79,70,229,.35);cursor:pointer;z-index:1090;transition:transform .15s ease}
.cw-bubble:hover{transform:scale(1.05)}
.cw-bubble:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px}
.cw-bubble .cw-count{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:#ef4444;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--page-bg)}
.cw-panel{position:fixed;right:20px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:380px;max-width:calc(100vw - 32px);height:min(600px,calc(100vh - 120px));background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);z-index:1090;display:flex;flex-direction:column;overflow:hidden}
@media (max-width:575.98px){.cw-panel{right:16px;left:16px;width:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));height:calc(100vh - 110px)}.cw-bubble{right:16px}}
.cw-head{background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;padding:16px 18px;display:flex;align-items:flex-start;gap:10px}
.cw-head h3{font-size:16px;font-weight:600;margin:0;color:#fff}
.cw-head .cw-sub{font-size:12px;opacity:.85;margin-top:2px}
.cw-head button{border:0;background:rgba(255,255,255,.15);color:#fff;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.cw-head button:hover{background:rgba(255,255,255,.28)}
.cw-team{display:flex;margin-top:10px}
.cw-team span{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid #4f46e5;margin-right:-6px;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center}
.cw-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.cw-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cw-card-title{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 14px 4px}
.cw-new{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--surface);padding:12px 14px;text-align:left;cursor:pointer;color:var(--text)}
.cw-new:hover{background:var(--surface-2)}
.cw-new .cw-ico{width:34px;height:34px;border-radius:50%;background:var(--info-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cw-thread{display:flex;gap:10px;width:100%;border:0;border-top:1px solid var(--border-soft);background:var(--surface);padding:10px 14px;text-align:left;cursor:pointer;color:var(--text)}
.cw-thread:hover{background:var(--surface-2)}
.cw-thread .cw-subj{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw-thread .cw-prev{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw-thread .cw-when{font-size:11px;color:var(--text-faint);white-space:nowrap}
.cw-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-2);display:inline-block;margin-left:6px;vertical-align:middle}
.cw-msgs{display:flex;flex-direction:column;gap:10px}
.cw-msg{max-width:85%;display:flex;flex-direction:column;gap:3px}
.cw-msg .cw-who{font-size:11px;color:var(--text-faint)}
.cw-msg .cw-text{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.5;color:var(--text-2);white-space:pre-wrap}
.cw-msg.mine{align-self:flex-end;align-items:flex-end}
.cw-msg.mine .cw-text{background:var(--accent);border-color:var(--accent);color:#fff}
.cw-foot{border-top:1px solid var(--border);padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.cw-foot textarea{resize:none;min-height:64px;font-size:13px}
@media (max-width:575.98px){.portal-topbar{padding:0 16px}.portal-topbar #portal-cust{max-width:140px}.portal-topbar .topbar-right{min-width:0}}
.cw-note{font-size:11px;color:var(--text-faint)}

.info-strip:not(.open):not(.clipped) .info-chev{visibility:hidden}
.info-strip.open .info-chev{transform:rotate(180deg)}
/* One row: page tabs on the left, search / group / filter / sort on the right */
.page-nav{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;border-bottom:2px solid var(--border);margin-bottom:14px}
.page-nav .nav-tabs{border-bottom:0;flex-wrap:nowrap;overflow-x:auto}
.page-nav .nav-tabs .nav-link{border:none;border-bottom:2px solid transparent;margin-bottom:-2px;padding:10px 14px;font-size:14px;font-weight:500;color:var(--text-muted);white-space:nowrap}
.page-nav .nav-tabs .nav-link:hover{color:var(--text-2);border-color:var(--border-input)}
.page-nav .nav-tabs .nav-link.active{color:var(--accent);border-color:var(--accent);background:transparent}
.page-nav .nav-tabs .nav-link .badge{font-size:11px;font-weight:500;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle}
.page-nav .toolbar-right{padding-bottom:8px;margin-left:auto;flex-wrap:nowrap;min-width:0}
.page-nav .toolbar-search{flex:1 1 120px;min-width:110px;max-width:260px}
@media (max-width:575.98px){.page-nav .toolbar-right{flex-wrap:wrap}}
.page-nav .toolbar-search .form-control{height:36px}

/* ── Tables ── */
/* Index lists grow to the bottom of the viewport so the pagination footer sits near the fold. */
.data-table-wrapper{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;flex:1 1 auto;min-height:320px}
.data-table-wrapper .table-responsive{flex:1}
.grow{flex:1 1 auto;display:flex;flex-direction:column;min-height:320px}
.grow>.action-list,.grow>.thread-list{flex:1}
.chat-layout.grow{display:grid;align-items:stretch}
.chat-layout>.detail-card{display:flex;flex-direction:column;min-height:100%}
.chat-layout>.detail-card>.thread-list,.chat-layout>.detail-card>.msgs{flex:1}
.table{margin:0;font-size:14px;--bs-table-bg:transparent;--bs-table-color:var(--text-2);--bs-table-hover-bg:var(--surface-2);--bs-table-hover-color:var(--text-2)}
.table thead th{background:var(--surface-2);border-bottom:1px solid var(--border);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);padding:12px 16px;white-space:nowrap}
.table tbody td{padding:12px 16px;vertical-align:middle;border-bottom:1px solid var(--border-soft);color:var(--text-2)}
.table tbody tr:last-child td{border-bottom:none}
.table tbody tr.link{cursor:pointer}
.item-name{font-weight:500;color:var(--text)}
.item-name a{color:var(--text);text-decoration:none}
.item-name a:hover{color:var(--accent)}
.item-sub{font-size:12px;color:var(--text-muted);font-weight:400}
.table-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text-muted);gap:12px;flex-wrap:wrap}
.pagination{margin:0;gap:2px}
.pagination .page-link{border:1px solid var(--border-input);color:var(--text-2);font-size:13px;font-weight:500;padding:5px 11px;border-radius:6px!important;min-width:34px;text-align:center;background:var(--surface)}
.pagination .page-item.active .page-link{background:var(--accent);border-color:var(--accent);color:#fff}
.pagination .page-item.disabled .page-link{color:var(--border-input);background:var(--surface)}
.num{text-align:right;font-family:var(--bs-font-monospace);font-variant-numeric:tabular-nums}

/* ── Badges ── */
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.status-badge .status-dot{width:6px;height:6px;border-radius:50%}
.status-badge.active{background:var(--good-bg);color:var(--good-fg)} .status-badge.active .status-dot{background:var(--good-dot)}
.status-badge.pending{background:var(--warn-bg);color:var(--warn-fg)} .status-badge.pending .status-dot{background:var(--warn-dot)}
.status-badge.danger{background:var(--crit-bg);color:var(--crit-fg)} .status-badge.danger .status-dot{background:var(--crit-dot)}
.status-badge.info{background:var(--info-bg);color:var(--info-fg)} .status-badge.info .status-dot{background:var(--info-dot)}
.status-badge.inactive{background:var(--gray-bg);color:var(--gray-fg)} .status-badge.inactive .status-dot{background:var(--gray-dot)}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500;background:var(--surface-3);color:var(--text-2)}
.tag.blue{background:var(--info-bg);color:var(--info-fg)} .tag.amber{background:var(--warn-bg);color:var(--warn-fg)} .tag.green{background:var(--good-bg);color:var(--good-fg)} .tag.red{background:var(--crit-bg);color:var(--crit-fg)}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}

/* ── Cards (dashboard-card / detail-card) ── */
.detail-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;min-width:0}
.detail-card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border-soft);gap:10px;flex-wrap:wrap}
.detail-card-header h3{font-size:15px;font-weight:600;color:var(--text);margin:0}
.detail-card-header .card-action{font-size:13px;color:var(--accent-2);text-decoration:none;font-weight:500}
.detail-card-header .card-action:hover{color:var(--accent)}
.detail-card-header .card-note{font-size:13px;color:var(--text-muted)}
.detail-card-body{padding:20px}
.detail-card-body.flush{padding:0}
.detail-card-footer{padding:12px 20px;border-top:1px solid var(--border-soft);font-size:12px;color:var(--text-muted)}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px}
.stat-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.stat-card-header .stat-label{font-size:13px;font-weight:500;color:var(--text-muted)}
.stat-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.stat-icon.blue{background:var(--info-bg);color:var(--info-dot)} .stat-icon.green{background:var(--good-bg);color:var(--good-dot)} .stat-icon.amber{background:var(--warn-bg);color:var(--warn-dot)} .stat-icon.red{background:var(--crit-bg);color:var(--crit-dot)} .stat-icon.gray{background:var(--gray-bg);color:var(--gray-fg)}
.stat-value{font-size:28px;font-weight:700;color:var(--text);letter-spacing:-.5px;line-height:1}
.stat-change{font-size:12px;color:var(--text-faint);margin-top:8px}
a.stat-card{display:block;text-decoration:none;color:inherit;transition:border-color .15s ease}
a.stat-card:hover{border-color:var(--accent-2)}
a.stat-card .stat-link{font-size:12px;color:var(--accent);margin-top:8px;display:flex;align-items:center;gap:4px}
/* Period comparison (performance over time) */
.period-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.period-card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border-soft);gap:12px;flex-wrap:wrap}
.period-toggle{display:flex;background:var(--surface-3);border-radius:8px;padding:3px;gap:2px}
.period-toggle .toggle-btn{padding:5px 14px;border-radius:6px;border:none;background:transparent;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;white-space:nowrap}
.period-toggle .toggle-btn:hover{color:var(--text-2)}
.period-toggle .toggle-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.period-nav{display:flex;align-items:center;gap:8px}
.period-nav .year-label{font-size:15px;font-weight:600;color:var(--text);min-width:120px;text-align:center}
.period-nav .nav-arrow{width:28px;height:28px;border-radius:6px;border:1px solid var(--border-input);background:var(--surface);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px}
.period-nav .nav-arrow:hover{background:var(--surface-2);color:var(--text-2)}
.period-nav .nav-arrow:disabled{opacity:.35;cursor:default}
.period-today{font-size:12px;font-weight:500;color:var(--text-muted);background:var(--surface-3);padding:4px 10px;border-radius:6px;white-space:nowrap}
.period-table{width:100%;font-size:13px;border-collapse:collapse}
.period-table thead th{padding:10px 14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:bottom}
.period-table thead th:first-child{text-align:left;color:var(--text-muted);padding-left:20px}
.period-table thead th .sub{display:block;font-weight:400;text-transform:none;letter-spacing:0;font-style:italic;color:var(--text-faint);font-size:11px}
.period-table tbody td{padding:9px 14px;text-align:right;color:var(--text-2);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--border-soft);white-space:nowrap}
.period-table tbody td:first-child{text-align:left;font-weight:500;color:var(--text-muted);padding-left:20px;white-space:normal}
.period-table tbody tr:last-child td{border-bottom:none}
.period-table tbody tr.row-highlight td{font-weight:600;color:var(--text);background:rgba(99,102,241,.04)}
.period-table tbody tr.row-highlight td:first-child{color:var(--accent)}
.period-table tbody tr.row-negative td{color:var(--text-faint)}
.period-table .empty-cell{color:var(--border-input)}
.period-table .delta{font-size:11px;font-weight:500;margin-left:6px}
.period-table .delta.up{color:var(--good-dot)} .period-table .delta.down{color:var(--crit-dot)}
.dashboard-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.show-layout{display:grid;grid-template-columns:2fr 1fr;gap:20px}
@media (max-width:991.98px){.dashboard-grid,.show-layout{grid-template-columns:1fr}}
.show-main,.show-sidebar{display:flex;flex-direction:column;gap:20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}

/* ── Rows / lists ── */
.action-list{list-style:none;margin:0;padding:0}
.action-item{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border-soft)}
.action-item:last-child{border-bottom:none}
.action-item.done{opacity:.55}
.action-item .stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--border-input);flex-shrink:0}
.stripe.crit{background:var(--crit-dot)} .stripe.warn{background:var(--warn-dot)} .stripe.good{background:var(--good-dot)} .stripe.info{background:var(--info-dot)}
.action-text{font-size:14px;color:var(--text);font-weight:500}
.action-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
.action-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}
.empty{padding:20px;color:var(--text-muted);font-size:14px}
.status-banner{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:8px;margin-bottom:20px;font-size:13px;font-weight:500;flex-wrap:wrap}
.status-banner.active{background:var(--good-bg);color:var(--good-fg);border:1px solid rgba(34,197,94,.25)}
.status-banner.pending{background:var(--warn-bg);color:var(--warn-fg);border:1px solid rgba(245,158,11,.3)}
.status-banner.danger{background:var(--crit-bg);color:var(--crit-fg);border:1px solid rgba(239,68,68,.3)}
.status-banner.info{background:var(--info-bg);color:var(--info-fg);border:1px solid rgba(99,102,241,.3)}
.status-banner .bi{font-size:16px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.detail-field{padding:10px 0;border-bottom:1px solid var(--border-soft);min-width:0}
.detail-field.full-width{grid-column:1/-1}
.detail-label{font-size:11px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.detail-value{font-size:14px;color:var(--text);font-weight:450;overflow-wrap:anywhere}
.meta-list{list-style:none;padding:0;margin:0}
.meta-item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft)}
.meta-item:last-child{border-bottom:none}
.meta-label{font-size:13px;color:var(--text-muted);flex-shrink:0}
.meta-value{font-size:13px;font-weight:500;color:var(--text);text-align:right;min-width:0;overflow-wrap:anywhere}
.timeline{list-style:none;padding:0;margin:0}
.timeline-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-soft)}
.timeline-item:last-child{border-bottom:none}
.timeline-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.timeline-icon.blue{background:var(--info-bg);color:var(--info-dot)} .timeline-icon.green{background:var(--good-bg);color:var(--good-dot)} .timeline-icon.amber{background:var(--warn-bg);color:var(--warn-dot)} .timeline-icon.gray{background:var(--gray-bg);color:var(--gray-fg)}
.timeline-text{font-size:13px;color:var(--text-2);line-height:1.5}
.timeline-time{font-size:12px;color:var(--text-faint);margin-top:2px}
.check-list{list-style:none;padding:0;margin:0}
.check-item{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border-soft)}
.check-item:last-child{border-bottom:none}
.check-item.na{opacity:.5}
.check-item .form-check-input{margin:0;flex-shrink:0}
.check-item .form-check-input:checked{background-color:var(--good-dot);border-color:var(--good-dot)}
.check-item.over .form-check-input:checked{background-color:var(--warn-dot);border-color:var(--warn-dot)}
.check-label{flex:1;min-width:0;font-size:14px;color:var(--text)}
.check-sub{font-size:12px;color:var(--text-muted)}

/* ── Shipment block & milestones ── */
.ship{border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.ship-head{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 8px}
.ship.open .ship-head{border-bottom:1px solid var(--border-soft)}
.ship-toggle{width:28px;height:28px;border:0;background:transparent;color:var(--text-muted);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.ship-toggle:hover{background:var(--surface-3);color:var(--text)}
.ship-toggle .chev{transition:transform .15s ease;font-size:12px}
.ship.open .ship-toggle .chev{transform:rotate(90deg)}
.ship-sum{flex:1;min-width:0}
.ship-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;padding:14px 16px}
@media (max-width:640px){.ship-body{grid-template-columns:1fr}}
.ship-name{font-size:15px;font-weight:600;color:var(--text);margin:0}
.ship-kind{font-size:11px;color:var(--text-muted);border:1px solid var(--border);border-radius:6px;padding:1px 7px}
.ms{list-style:none;margin:0;padding:0}
.ms li{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:5px 0;position:relative}
.ms li::before{content:"";position:absolute;left:8px;top:-5px;bottom:-5px;width:2px;background:var(--border)}
.ms li:first-child::before{top:50%}.ms li:last-child::before{bottom:50%}
.ms .k{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-input);background:var(--surface);position:relative;z-index:1}
.ms li.done .k{background:var(--good-dot);border-color:var(--good-dot)}
.ms li.now .k{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--info-bg)}
.ms li.late .k{border-color:var(--crit-dot)}
.ms .n{font-size:13px;color:var(--text);font-weight:500}
.ms li.future .n{color:var(--text-muted);font-weight:400}
.ms .dt{font-family:var(--bs-font-monospace);font-size:12px;color:var(--text-faint)}
.ms li.done .dt{color:var(--text-2)}

/* ── Forecast bars ── */
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.bar-row .lbl{font-family:var(--bs-font-monospace);font-size:12px;color:var(--text-muted);width:3.6rem;flex-shrink:0}
.bar-track{display:flex;gap:2px;height:16px;flex:1}
.bar-seg{height:100%;border-radius:2px;min-width:3px}
.bar-seg.placed{background:var(--accent-2)} .bar-seg.toplace{background:var(--warn-dot)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ── Chats ── */
.chat-layout{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:991.98px){.chat-layout{grid-template-columns:1fr}}
.thread-list{list-style:none;margin:0;padding:0}
.thread-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-soft);cursor:pointer;text-decoration:none;color:inherit}
.thread-item:last-child{border-bottom:none}
.thread-item:hover{background:var(--surface-2)}
.thread-item.active{background:var(--info-bg)}
.thread-item .avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.thread-item .avatar.vendor{background:var(--warn-bg);color:var(--warn-fg)}
.thread-item .avatar.customer{background:var(--info-bg);color:var(--info-fg)}
.thread-item .subj{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread-item .prev{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread-item .meta{font-size:11px;color:var(--text-faint);white-space:nowrap;text-align:right;flex-shrink:0}
.thread-item .unread{width:8px;height:8px;border-radius:50%;background:var(--accent-2);display:inline-block;margin-left:4px}
.thread-head{padding:14px 20px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.thread-head h3{font-size:16px;font-weight:600;margin:0 0 2px}
.msgs{padding:16px 20px;display:flex;flex-direction:column;gap:14px;background:var(--surface-2)}
.msg{max-width:min(640px,92%);display:flex;flex-direction:column;gap:4px}
.msg .who{font-size:12px;color:var(--text-muted)}
.msg .bubble{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text-2);line-height:1.55;white-space:pre-wrap}
.msg.us{align-self:flex-end;align-items:flex-end}
.msg.us .bubble{background:var(--info-bg);border-color:transparent;color:var(--text)}
.msg.system .bubble{background:var(--surface-3);border-style:dashed;font-size:13px}
.msg .att{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:3px 8px;color:var(--text-2);margin-top:4px}
.composer{padding:14px 20px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:8px}
.composer textarea{resize:vertical;min-height:72px}
.composer.drafted textarea{min-height:150px;border-color:var(--accent-2);box-shadow:inset 3px 0 0 var(--accent-2)}
.draft-note{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--accent);flex-wrap:wrap}

/* ── Email preview ── */

.email .hd{font-family:var(--bs-font-monospace);font-size:12px;color:var(--text-faint);margin-bottom:8px}

.portal-topbar{height:var(--topbar-height);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:1030}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function syncTheme() {
  const t = document.documentElement.getAttribute('data-theme');
  const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
}
/* User toggle: Auto follows the viewer or OS; Light and Dark pin it. Remembered per browser. */
let themePref = 'auto'; try { themePref = localStorage.getItem('se-theme') || 'auto'; } catch (e) {}
function applyTheme() { if (themePref === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', themePref); syncTheme(); }
const THEME_UI = { auto: ['circle-half', 'Theme: Auto (follows system)'], light: ['sun', 'Theme: Light'], dark: ['moon-stars', 'Theme: Dark'] };
const themeButton = () => `<button class="topbar-icon-btn" type="button" title="${THEME_UI[themePref][1]}" aria-label="${THEME_UI[themePref][1]}" onclick="act.theme()"><i class="bi bi-${THEME_UI[themePref][0]}"></i></button>`;
applyTheme();
new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);

  shipments.filter(s => s.needAfter).forEach(s => { const ref = ship(s.needAfter.ship); s.needBy = ref.needBy ? isoNearest(addDays(eta(ref), s.needAfter.days)) : null; });
}

const ackDue = p => addDays(p.received, 2);
let ackOpen = null;   // the order whose acknowledgement draft is open
function ackStatus(p) {
  if (p.ack.signed) return { k:'good', t:`Signed ${fmt(p.ack.signed)}` };
  if (p.ack.sent) return { k: diffDays(TODAY, p.ack.sent) > 2 ? 'warn' : 'info', t:`Sent ${fmt(p.ack.sent)}, waiting for signature` };

}

  if (T.orderSort === 'customer') list.sort((a, b) => cust(a.p.customer).name.localeCompare(cust(b.p.customer).name));

/* Alan's ask from Oct 23: hold salespeople accountable for how clean their orders arrive and how much they change.
   Account numbers come from each rep's customers; order numbers come from the orders each rep handled. */
const reps = () => [...new Set([...customers.map(c => c.rep), ...pos.map(p => p.rep)])].sort();
function repStats(r) {
  const cs = customers.filter(c => c.rep === r), ps = pos.filter(p => p.rep === r), sh = ps.flatMap(p => shipsOf(p.id));
  return {
    customers: cs.length,
    completeness: cs.length ? Math.round(cs.reduce((a, c) => a + c.completeness, 0) / cs.length) : null,
    cos90: cs.reduce((a, c) => a + c.cos90, 0),
    open: ps.filter(p => !shipsOf(p.id).every(isDelivered)).length,
    queued: ps.filter(p => p.lane === 'queue').length,
    undated: sh.filter(s => !s.needBy).length,
    pending: changes.filter(c => c.status === 'pending' && ((c.po && po(c.po).rep === r) || (!c.po && c.target && cust(c.target) && cust(c.target).rep === r))).length,
    forwarded: intake.filter(i => i.flags.some(f => /sent by sales rep/i.test(f)) && i.link && po(i.link) && po(i.link).rep === r).length,
    overrides: ps.reduce((a, p) => a + p.gate.filter(g => g[3] === 'over').length, 0),
  };
}

function factoryForecast(vendorId) {
  const months = []; for (let i = 0; i < 9; i++) { const m = new Date(2026, 10 + i, 1); months.push({ y:m.getFullYear(), m:m.getMonth(), label:`${MONTHS[m.getMonth()]} ${String(m.getFullYear()).slice(2)}` }); }
  const key = dt => `${d(dt).getFullYear()}-${d(dt).getMonth()}`;
  const mine = s => s.originCo === vendorId;
  const rows = months.map(mo => { const k = `${mo.y}-${mo.m}`;
    return { ...mo, placed: shipments.filter(s => mine(s) && s.placedAt && !isDelivered(s) && key(milestones(s)[1].date) === k).length, toplace: shipments.filter(s => mine(s) && !s.placedAt && s.needBy && key(placeBy(s)) === k).length }; });
  const unknown = shipments.filter(s => mine(s) && !s.needBy).length;
  const max = Math.max(3, ...rows.map(r => r.placed + r.toplace));
  const unplaced = shipments.filter(s => mine(s) && !s.placedAt).sort((a,b) => (placeBy(a)||new Date(2100,0,1)) - (placeBy(b)||new Date(2100,0,1)));
  return `<div class="detail-card"><div class="detail-card-header"><h3>Factory forecast</h3><div class="legend"><span><i style="background:var(--accent-2)"></i>Placed, finishing production</span><span><i style="background:var(--warn-dot)"></i>Must be placed this month</span></div></div>
    <div class="detail-card-body">${rows.map(r => `<div class="bar-row"><span class="lbl">${r.label}</span><div class="bar-track">${Array.from({length:r.placed}).map(()=>`<span class="bar-seg placed" style="width:${100/max}%"></span>`).join('')}${Array.from({length:r.toplace}).map(()=>`<span class="bar-seg toplace" style="width:${100/max}%"></span>`).join('')}</div><span class="mono item-sub" style="width:1.5rem;text-align:right">${r.placed + r.toplace || ''}</span></div>`).join('')}
    <p class="item-sub mt-3 mb-0">Ryan's two spreadsheets in one place: what is placed with the mill by the month it finishes production, and what the queue says must be placed each month. Plus <b>${unknown}</b> shipments with no need-by date that cannot be scheduled yet.</p></div></div>
  <div class="data-table-wrapper"><div class="detail-card-header"><h3>Not yet placed</h3><span class="card-note">sorted by place-by date</span></div><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Customer · Job</th><th>Shipment</th><th>Need-by</th><th>Place by</th><th>Est. delivery if placed today</th><th>Status</th></tr></thead><tbody>
    ${unplaced.map(s => { const p = po(s.po); const pb = placeBy(s); return `<tr class="link" onclick="go('po-${p.id.slice(3)}')"><td class="item-name"><a href="#po-${p.id.slice(3)}">${esc(cust(p.customer).name)}</a><div class="item-sub">${esc(p.job)}</div></td><td>${esc(s.name)} <span class="item-sub">→ ${esc(s.port)}</span></td><td class="mono">${needShort(s) || sb('pending', 'unknown')}</td><td class="mono">${pb ? fmt(pb) : '—'}</td><td class="mono">${fmt(addDays(TODAY, totalDays(s)))}</td><td>${pill(health(s))}</td></tr>`; }).join('')}
    ${unplaced.length ? '' : '<tr><td colspan="6" class="empty">Nothing waiting to be placed.</td></tr>'}
  </tbody></table></div>${tableFooter(unplaced.length, 'shipments')}</div>`;
}

      const owed = [...open.filter(g => g[2] === 'Customer').map(g => g[1].toLowerCase()), ...(sh.some(s => !s.needBy && !s.asap) ? ['need-by dates'] : []), ...(sh.some(s => /missing/i.test(s.dest)) ? ['the ship-to address'] : [])], ours = open.filter(g => g[2] !== 'Customer').length;
      const sub = owed.length ? `The customer still owes ${owed.join(', ')}${ours ? ` · ${ours} item${ours > 1 ? 's' : ''} open on our side` : ''}` : `${sh.filter(isDelivered).length} of ${sh.length} shipments delivered · ${p.sqft.toLocaleString()} sq ft`;
      return actionItem(h, `<a href="#po-${p.id.slice(3)}" class="text-decoration-none">${esc(cust(p.customer).name)}</a> <span class="text-body-secondary fw-normal">· ${esc(p.job)}</span>`, esc(sub), pill({ k:h, t:PO_LABEL[h] })); }).join('') : '<li class="empty">No open orders where you are the sales rep.</li>'}</ul></div>`;
}
function teamCard() {
  const all = nextActions(), n = (x, word) => `${x} ${word}${x === 1 ? '' : 's'}`;
  return `<div class="detail-card mb-3"><div class="detail-card-header"><h3>The team today</h3><span class="card-note">who the proposed actions fall to</span></div>
    <ul class="action-list">${Object.keys(TEAM_ROLE).map(k => { const mine = all.filter(a => actionOwner(a) === k).length, chats = threads.filter(t => t.assignee === k && t.status !== 'closed').length, orders = openAsRep(k).length;
      return actionItem(mine ? 'info' : 'muted', `${esc(TEAM[k])} <span class="text-body-secondary fw-normal">· ${TEAM_ROLE[k]}</span>`, [n(mine, 'proposed action'), n(chats, 'open chat'), orders ? `${n(orders, 'open order')} as sales rep` : ''].filter(Boolean).join(' · '), k === ME ? '' : `<button class="btn btn-sm btn-outline-secondary" onclick="act.viewAs('${k}')">View as</button>`); }).join('')}</ul></div>`;
}
const roleCard = () => TEAM_ROLE[ME] === 'Sales' ? repOrdersCard() : TEAM_ROLE[ME] === 'Operations' ? teamCard() : '';
const viewAsItems = () => Object.keys(TEAM_ROLE).map(k => `<li><button type="button" class="dropdown-item ${k === ME ? 'active' : ''}" onclick="act.viewAs('${k}')">${esc(TEAM[k])} · ${TEAM_ROLE[k]}</button></li>`).join('');
Object.assign(act, {
  viewAs(k) { ME = k; T.todoFilter = TEAM_ROLE[k] === 'Operations' ? 'all' : k; toast(`Viewing as <b>${esc(TEAM[k])}</b>, ${TEAM_ROLE[k].toLowerCase()}.`); if (route === 'today') render(); else go('today'); },
});

function topbar() {
  return `<header class="topbar"><div class="d-flex align-items-center gap-2 minw0"><button class="topbar-icon-btn d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open navigation"><i class="bi bi-list"></i></button><nav aria-label="breadcrumb"><ol class="breadcrumb">${crumbs().map(c => c[1] ? `<li class="breadcrumb-item"><a href="#${c[1]}">${esc(c[0])}</a></li>` : `<li class="breadcrumb-item active" aria-current="page">${esc(c[0])}</li>`).join('')}</ol></nav></div>
    <div class="topbar-right"><span class="proto-tag d-none d-lg-inline">prototype · sample data · today = Oct 26, 2026</span>${themeButton()}<button class="topbar-icon-btn" title="Notifications" onclick="act.stub('<b>Prototype.</b> Notifications would open here.')"><i class="bi bi-bell"></i>${nextActions().length ? '<span class="notification-dot"></span>' : ''}</button>
    <div class="dropdown"><button class="user-menu-btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false"><div class="user-avatar">${initials(TEAM[ME])}</div><span class="user-name d-none d-sm-inline">${esc(TEAM[ME])}</span></button><ul class="dropdown-menu dropdown-menu-end"><li><h6 class="dropdown-header">View as</h6></li>${viewAsItems()}<li><hr class="dropdown-divider"></li><li><a class="dropdown-item" href="#today"><i class="bi bi-person me-2"></i>My profile</a></li><li><a class="dropdown-item" href="#settings"><i class="bi bi-gear me-2"></i>Constraints</a></li><li><hr class="dropdown-divider"></li><li><a class="dropdown-item text-danger" href="#today"><i class="bi bi-box-arrow-right me-2"></i>Sign out</a></li></ul></div></div></header>`;
}

/* ---------- portal chat launcher: the customer's side of the same threads the team works in Chats ---------- */
const cw = { open:false, view:'home', tid:null, about:'', draft:'' };
const custThreads = () => threads.filter(t => t.company === portalCustomer);
const custVisible = t => t.msgs.filter(m => m[0] !== 'system');
const custUnread = t => { const v = custVisible(t); return t.status !== 'closed' && v.length && v[v.length - 1][0] === 'us' && !t.custSeen; };
const cwWhen = at => { const [dt, tm] = at.split(' '); return dt === iso(TODAY) ? (tm || 'today') : fmt(dt); };
const cwWho = (t, m) => m[0] === 'them' ? 'You' : (m[4] && /automatic|reminder/i.test(m[4]) ? 'Surface Edge · automatic' : `${(TEAM[t.assignee] || 'Surface Edge').split(' ')[0]} · Surface Edge`);
const cwComposer = (id, placeholder, send) => `<div class="cw-foot"><textarea class="form-control" id="${id}" placeholder="${placeholder}" oninput="cw.draft=this.value" onkeydown="if(event.key==='Enter'&&(event.metaKey||event.ctrlKey)){event.preventDefault();${send}}">${esc(cw.draft)}</textarea><div class="d-flex justify-content-between align-items-center gap-2"><span class="cw-note">Your Surface Edge team sees this right away. Usually replies within a few hours.</span><button class="btn btn-primary btn-sm" onclick="${send}"><i class="bi bi-send me-1"></i>Send</button></div></div>`;
function renderWidget() {
  const el = document.getElementById('chat-widget'); if (!el) return;
  if (!isPortal()) { el.innerHTML = ''; return; }
  const c = cust(portalCustomer); const mine = custThreads(); const live = mine.filter(t => t.status !== 'closed'); const unread = live.filter(custUnread).length;
  const bubble = `<button class="cw-bubble" type="button" aria-label="${cw.open ? 'Close messages' : 'Message Surface Edge'}" aria-expanded="${cw.open}" onclick="act.cwToggle()"><i class="bi bi-${cw.open ? 'x-lg' : 'chat-dots-fill'}"></i>${!cw.open && unread ? `<span class="cw-count">${unread}</span>` : ''}</button>`;
  if (!cw.open) { el.innerHTML = bubble; return; }
  const team = ['RK','MR','MO'].map(i => `<span>${i}</span>`).join('');
  let head, body, foot = '';
  if (cw.view === 'thread' && thread(cw.tid)) {
    const t = thread(cw.tid); t.custSeen = true;
    head = `<div class="cw-head"><button type="button" onclick="act.cwView('home')" aria-label="Back"><i class="bi bi-chevron-left"></i></button><div class="minw0 flex-grow-1"><h3 class="text-truncate">${esc(t.subject)}</h3><div class="cw-sub">${t.po ? esc(po(t.po).job) + ' · ' : ''}${t.status === 'closed' ? 'Resolved' : t.status === 'open' ? 'With the Surface Edge team' : 'Waiting on you'}</div></div><button type="button" onclick="act.cwToggle()" aria-label="Close"><i class="bi bi-x-lg"></i></button></div>`;
    body = `<div class="cw-msgs">${custVisible(t).map(m => `<div class="cw-msg ${m[0] === 'them' ? 'mine' : ''}"><div class="cw-who">${esc(cwWho(t, m))} · ${esc(cwWhen(m[1]))}</div><div class="cw-text">${esc(m[2])}</div>${m[3] ? m[3].map(a => `<span class="att"><i class="bi bi-paperclip"></i>${esc(a)}</span>`).join('') : ''}</div>`).join('')}</div>`;
    foot = cwComposer('cw-reply', t.status === 'closed' ? 'Reply to reopen this conversation…' : 'Reply…', "act.cwReply()");
  } else if (cw.view === 'new') {
    const orders = pos.filter(p => p.customer === c.id);
    head = `<div class="cw-head"><button type="button" onclick="act.cwView('home')" aria-label="Back"><i class="bi bi-chevron-left"></i></button><div class="flex-grow-1"><h3>New message</h3><div class="cw-sub">Goes straight to your Surface Edge team</div></div><button type="button" onclick="act.cwToggle()" aria-label="Close"><i class="bi bi-x-lg"></i></button></div>`;
    body = `<div class="cw-card p-3"><label class="form-label small text-body-secondary mb-1" for="cw-about">What is this about?</label><select class="form-select form-select-sm" id="cw-about" onchange="cw.about=this.value"><option value="">Something else</option>${orders.map(p => `<option value="${p.id}" ${cw.about === p.id ? 'selected' : ''}>${esc(p.job)} · ${p.id}</option>`).join('')}</select><div class="cw-note mt-2">Picking an order puts your message next to its shipments and dates, so nobody has to ask which job you mean.</div></div>`;
    foot = cwComposer('cw-new', 'Ask a question, change a date, or send an update…', "act.cwStart()");
  } else {
    const done = mine.filter(t => t.status === 'closed');
    head = `<div class="cw-head"><div class="flex-grow-1"><h3>Hi ${esc(c.contact.split(' ')[0])}</h3><div class="cw-sub">Questions about an order? Message us here instead of email; it reaches the whole team.</div><div class="cw-team">${team}</div></div><button type="button" onclick="act.cwToggle()" aria-label="Close"><i class="bi bi-x-lg"></i></button></div>`;
    const row = t => { const v = custVisible(t); const last = v[v.length - 1]; return `<button type="button" class="cw-thread" onclick="act.cwOpen('${t.id}')"><div class="minw0 flex-grow-1"><div class="cw-subj">${esc(t.subject)}${custUnread(t) ? '<span class="cw-dot" aria-label="New reply"></span>' : ''}</div><div class="cw-prev">${last ? (last[0] === 'them' ? 'You: ' : '') + esc(last[2].replace(/\s+/g, ' ').slice(0, 80)) : ''}</div></div><div class="cw-when">${last ? esc(cwWhen(last[1])) : ''}</div></button>`; };
    body = `<div class="cw-card"><button type="button" class="cw-new" onclick="act.cwView('new')"><span class="cw-ico"><i class="bi bi-send"></i></span><span class="flex-grow-1"><b style="font-size:14px">Send us a message</b><div class="cw-note">Usually replies within a few hours</div></span><i class="bi bi-chevron-right text-body-secondary"></i></button></div>
      <div class="cw-card"><div class="cw-card-title">Open conversations</div>${live.length ? live.map(row).join('') : '<div class="px-3 pb-3 cw-note">No open conversations.</div>'}</div>
      ${done.length ? `<div class="cw-card"><div class="cw-card-title">Resolved</div>${done.map(row).join('')}</div>` : ''}`;
  }
  el.innerHTML = `<div class="cw-panel" role="dialog" aria-label="Messages with Surface Edge">${head}<div class="cw-body">${body}</div>${foot}</div>${bubble}`;
  const b = el.querySelector('.cw-body'); if (cw.view === 'thread' && b) b.scrollTop = b.scrollHeight;
}
const nowStamp = () => `${iso(TODAY)} ${new Date().toTimeString().slice(0, 5)}`;
Object.assign(act, {
  cwToggle() { cw.open = !cw.open; if (cw.open) cw.view = 'home'; renderWidget(); },
  cwView(v) { cw.view = v; if (v !== 'new') cw.about = ''; renderWidget(); setTimeout(() => document.getElementById(v === 'new' ? 'cw-new' : 'x')?.focus(), 0); },
  cwOpen(tid) { cw.view = 'thread'; cw.tid = tid; cw.draft = ''; renderWidget(); },
  cwAbout(poId) { cw.open = true; cw.view = 'new'; cw.about = poId; cw.draft = ''; renderWidget(); setTimeout(() => document.getElementById('cw-new')?.focus(), 0); },
  cwReply() {
    const t = thread(cw.tid); const body = (document.getElementById('cw-reply')?.value || '').trim(); if (!body) return;
    t.msgs.push(['them', nowStamp(), body]); t.status = 'open'; t.unread = true; t.custSeen = true; t.draftDismissed = true; cw.draft = '';
    if (t.po) po(t.po).activity.push([iso(TODAY), `${cust(portalCustomer).contact} replied in the portal chat: "${body.slice(0, 80)}${body.length > 80 ? '…' : ''}"`]);
    toast('<b>Sent.</b> Your Surface Edge team has it.'); render();
  },
  cwStart() {
    const body = (document.getElementById('cw-new')?.value || '').trim(); if (!body) { document.getElementById('cw-new')?.focus(); return; }
    const c = cust(portalCustomer); const pc = contactsOf(c.id).find(x => x.primary); const about = cw.about ? po(cw.about) : null;
    const id = 'T' + (Math.max(...threads.map(t => Number(t.id.slice(1)))) + 1);
    const subject = about ? `${about.job}: ${body.split(/[.?!\n]/)[0].slice(0, 60)}` : body.split(/[.?!\n]/)[0].slice(0, 70);
    threads.unshift({ id, subject, company: c.id, contact: pc ? pc.id : null, assignee: 'marlene', status: 'open', po: about ? about.id : null, unread: true, custSeen: true,
      msgs: [['them', nowStamp(), body], ['system', nowStamp(), `Started in the customer portal by ${c.contact}${about ? `, about ${about.job}` : ''}. Assigned to ${TEAM.marlene} (customer service).`]] });
    if (about) about.activity.push([iso(TODAY), `${c.contact} started a portal chat: "${body.slice(0, 80)}${body.length > 80 ? '…' : ''}"`]);
    cw.view = 'thread'; cw.tid = id; cw.draft = ''; cw.about = '';
    toast('<b>Message sent.</b> It is in the team’s Chats now, not an inbox.'); render();
  },
});
// Seed: TCC has an unread automatic reply on Sugarloaf, so the bubble shows a count.
threads.forEach(t => { t.custSeen = !(t.id === 'T1' || t.id === 'T2'); });

function renderMain() {
  const main = document.getElementById('main');
  if (isPortal()) {
    const m = route.match(/^portal-po-(\d+)$/);
    main.innerHTML = m ? viewPortalPO('PO-' + m[1]) : viewPortal();
    renderWidget();
    return;
  }
  let body;
  if (route === 'todo' || route.startsWith('todo-')) body = viewTodo(route.split('-')[1] || null);
  else if (route === 'feed' || route.startsWith('feed-')) body = viewFeed(route.split('-')[1] || null);
  else if (route === 'intake') body = viewIntake();
  else if (route === 'orders-queue') body = viewOrders('queue');
  else if (route === 'orders-production') body = viewOrders('production');
  else if (route === 'orders-complete') body = viewOrders('complete');
  else if (route === 'new-po') body = viewNewPO();
  else if (/^po-\d+/.test(route)) { const m = route.match(/^po-(\d+)(?:-(\w+))?$/); body = m ? viewPO('PO-' + m[1], m[2] || 'shipments') : viewToday(); }
  else if (route.startsWith('ship-')) body = viewShipEdit(route.slice(5));
  else if (route === 'changes' || route.startsWith('changes-')) { coTab = route === 'changes' ? 'pending' : route.slice(8); if (!CO_STATUS[coTab]) coTab = 'pending'; body = viewChanges(); }
  else if (route === 'customers' || route.startsWith('customers-')) body = viewCustomers(route === 'customers' ? null : route.slice(10));
  else if (route.startsWith('customer-')) { const r = parseShow('customer-', cust, CUSTOMER_SHOW_TABS); body = viewCustomer(r.id, r.tab); }
  else if (route.startsWith('chats-')) { lastChatTab = route.slice(6); body = viewChats(lastChatTab); }
  else if (route.startsWith('chat-')) { const t = thread(route.slice(5)); const tab = t ? activeNav().slice(6) : 'inbox'; body = viewChats(tab, t ? t.id : null); }
  else if (route === 'vendors' || route.startsWith('vendors-')) body = viewVendors(route === 'vendors' ? null : route.slice(8));
  else if (route.startsWith('vendor-')) { const r = parseShow('vendor-', vendor, VENDOR_SHOW_TABS); body = viewVendor(r.id, r.tab); }
  else if (route === 'contacts' || route.startsWith('contacts-')) body = viewContacts(route === 'contacts' ? null : route.slice(9));
  else if (route.startsWith('contact-')) { const r = parseShow('contact-', contact, CONTACT_SHOW_TABS); body = viewContact(r.id, r.tab); }
  else if (route === 'forecast') body = viewVendor('daizhin', 'forecast');
  else if (route === 'settings') body = viewSettings();
  else body = viewToday();
  main.innerHTML = topbar() + `<div class="page-content">${body}</div>`;
  renderWidget();
  markClipped();
}
/* Close the phone menu when the window widens past phone width. Bootstrap does this only for a menu that stops being position:fixed, and this sidebar stays fixed on desktop, so its backdrop would stay over the page. */
matchMedia('(max-width: 767.98px)').addEventListener('change', e => { if (!e.matches && window.bootstrap) bootstrap.Offcanvas.getInstance(document.getElementById('sidebar'))?.hide(); });
window.addEventListener('resize', () => markClipped());
let lastRoute = null;
/* The "Delivery contact" checklist item follows the shipments: it ticks itself once every dated shipment has one.
   It never un-ticks, so a contact confirmed by phone and marked Done by hand stays done. */
const noContact = p => shipsOf(p.id).filter(s => s.needBy && !s.delivery);
const noContactNote = p => { const n = noContact(p); return n.length ? ` · missing on ${n.map(s => s.name).join(', ')}` : shipsOf(p.id).some(s => s.needBy) ? '' : ' · once shipments have dates'; };
function syncDeliveryGate() {
  pos.forEach(p => { const g = p.gate.find(x => x[0] === 'delivery'); if (!g || g[3] !== 'pending') return;
    if (shipsOf(p.id).some(s => s.needBy) && !noContact(p).length) { g[3] = 'done'; p.activity.push([iso(TODAY), 'Every dated shipment has a delivery contact. Checklist item ticked.']); } });
}
function render() {
  resolveNeedBy();
  syncDeliveryGate();
  document.body.classList.toggle('portal', isPortal());
  if (!isPortal()) renderSidebar();
  if (route !== lastRoute) { q = ''; renaming = null; const side = document.getElementById('sidebar'); if (window.bootstrap) bootstrap.Offcanvas.getInstance(side)?.hide(); }
  renderMain();
  if (route !== lastRoute) window.scrollTo(0, 0);
  lastRoute = route;
}
route = location.hash.replace('#', '') || 'today';
if (route === 'orders') route = 'orders-production';
render();
</script>
